name: Publish beta release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-beta.yml"
      - "scripts/build-release.py"
      - "src/**"
      - "updates.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check src/bootstrap.js
          node --check src/content/plugin.js
          node --check src/content/preview.js
          node --check src/content/epub.js
          node --check src/content/outline-preservation.js

      - name: Verify existing PDF bookmark trees remain intact
        run: node --test tests/outline-preservation.test.cjs

      - name: Build and validate the installable XPI
        run: python3 scripts/build-release.py

      - name: Publish installable artifacts and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("src/manifest.json"))["version"])')"
          xpi="zoterobooksplitter${version}.xpi"
          source="zotero-book-splitter-${version}-source.zip"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${xpi}" "${source}"
          if ! git diff --cached --quiet; then
            git commit -m "Publish Zotero Book Splitter ${version} artifacts [skip ci]"
            git push origin HEAD:main
          fi

          if gh release view "v${version}" >/dev/null 2>&1; then
            gh release upload "v${version}" "${xpi}" "${source}" --clobber
          else
            gh release create "v${version}" "${xpi}" "${source}" \
              --target "$(git rev-parse HEAD)" \
              --title "Zotero Book Splitter ${version} Beta" \
              --notes "Adds native EPUB 2/3 chapter splitting, preserves linked notes outside the reading spine, and retains existing multi-level PDF bookmarks, destinations, styles, and collapse state during bookmark repair." \
              --prerelease
          fi
