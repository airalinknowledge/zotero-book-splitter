name: Publish beta release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.13.6 beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.6 >/dev/null 2>&1; then
            echo "Release v0.13.6 already exists"
            exit 0
          fi
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="v0.13.6" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="Zotero Book Splitter 0.13.6 Beta" \
            -f body="Small-scale beta release for Zotero 9. Please verify chapter titles, authors, and page ranges before generating items." \
            -F draft=false \
            -F prerelease=true \
            --jq '.id')"
          curl --fail-with-body --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/x-xpinstall" \
            --data-binary "@zoterobooksplitter0.13.6.xpi" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=zoterobooksplitter0.13.6.xpi"
